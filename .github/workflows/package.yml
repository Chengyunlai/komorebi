name: Package macOS prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      KOMOREBI_TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          npm_config_arch: arm64
      - run: npm run setup:electron
        env:
          npm_config_arch: arm64
      - run: npm run check:release
      - run: npm run verify
      - run: npm run build:music
      - run: npm run build:audio
      - run: npm run package:mac
      - name: Preserve application symlinks and permissions
        run: ditto -c -k --sequesterRsrc --keepParent release/Komorebi.app release/Komorebi-macOS-arm64-prototype.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Komorebi-macOS-arm64-prototype
          path: release/Komorebi-macOS-arm64-prototype.zip
          retention-days: 7
          if-no-files-found: error
      - name: Verify downloadable application archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=Komorebi-macOS-arm64-prototype.zip
          check_dir="$RUNNER_TEMP/komorebi-artifact-check"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Komorebi-macOS-arm64-prototype --dir "$check_dir"
          cmp "release/$archive" "$check_dir/$archive"
          ditto -x -k "$check_dir/$archive" "$check_dir/unpacked"
          application="$check_dir/unpacked/Komorebi.app"
          test -x "$application/Contents/MacOS/Electron"
          test -L "$application/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          test -f "$application/Contents/Resources/app/electron/main.cjs"
          test -d "$application/Contents/Resources/app/native/mediaremote/MediaRemoteAdapter.framework"
          codesign --verify --deep --strict "$application"
