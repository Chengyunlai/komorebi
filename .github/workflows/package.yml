name: Package macOS prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      KOMOREBI_TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          npm_config_arch: arm64
      - run: npm run setup:electron
        env:
          npm_config_arch: arm64
      - run: npm run check:release
      - run: npm run verify
      - run: npm run build:music
      - run: npm run build:audio
      - run: npm run package:mac
      - name: Preserve application symlinks and permissions
        run: ditto -c -k --sequesterRsrc --keepParent release/Komorebi.app release/Komorebi-macOS-arm64-prototype.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Komorebi-macOS-arm64-prototype
          path: release/Komorebi-macOS-arm64-prototype.zip
          retention-days: 7
          if-no-files-found: error
