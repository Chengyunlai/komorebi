name: Bug / 缺陷
description: Report reproducible behavior / 报告可复现的问题
body:
  - type: textarea
    id: behavior
    attributes:
      label: 问题与预期 / Actual and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS、芯片、Node、提交版本 / Environment
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或证据 / Logs or evidence
      description: 请移除密钥、个人内容及无再分发权的素材。Remove private data and restricted assets.
